name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, failing-gate-demo ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_bad_model:
        description: 'Demonstrate quality gate rejecting bad model'
        required: false
        type: boolean
        default: false

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Linting
  # ----------------------------------------------------------------------------
  lint:
    name: Linting (Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install flake8

      - name: Run Flake8
        run: flake8 --max-line-length=120 --ignore=E402,E501,W503 worker service tests training

  # ----------------------------------------------------------------------------
  # Stage 2: Unit Tests (At least 3 tests)
  # ----------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r service/requirements.txt
          pip install pytest httpx

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_cleaning_rules.py tests/test_service_schema.py tests/test_nacl_rules.py tests/test_pipeline.py -v

  # ----------------------------------------------------------------------------
  # Stage 3: Model Evaluation & Quality Gate
  # ----------------------------------------------------------------------------
  model-evaluation:
    name: Model Evaluation & Quality Gate
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML Inference Dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers accelerate

      - name: Download Model from GitHub Release
        id: download_release
        run: |
          mkdir -p models/v1
          if [ "${{ inputs.test_bad_model }}" = "true" ] || [ "${{ github.ref_name }}" = "failing-gate-demo" ]; then
            echo "Demonstrating bad model: skipping release download."
          else
            echo "Downloading required model release assets from GitHub Release v1.0.0..."
            if ! command -v gh &> /dev/null; then
              echo "ERROR: GitHub CLI (gh) is not installed on runner!"
              exit 1
            fi
            if ! gh release download v1.0.0 --dir models/v1 --repo "$GITHUB_REPOSITORY"; then
              echo "ERROR: Failed to download GitHub Release v1.0.0 assets!"
              exit 1
            fi
            echo "Successfully downloaded release assets."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Model Inference & Quality Gate
        env:
          PYTHONPATH: .
        run: |
          if [ "${{ inputs.test_bad_model }}" = "true" ] || [ "${{ github.ref_name }}" = "failing-gate-demo" ]; then
            echo "============================================================"
            echo "DEMONSTRATING DELIBERATELY BAD MODEL QUALITY GATE FAILURE"
            echo "Using untrained Pythia-70M predictions (0.0% validity)"
            echo "============================================================"
            PRED_FILE="results/untrained_predictions.jsonl"
          else
            echo "============================================================"
            echo "RUNNING INFERENCE WITH DOWNLOADED v1.0.0 MODEL ARTIFACT"
            echo "============================================================"
            python evaluation/generate_predictions.py \
              --model models/v1 \
              --input cloud_assignment/data/validation.jsonl \
              --output results/student_v1_predictions.jsonl \
              --verify-checksum models/v1/model.sha256
            PRED_FILE="results/student_v1_predictions.jsonl"
          fi

          echo "Evaluating predictions against validation dataset with quality gate (--min-validity 95)..."
          python cloud_assignment/tools/score.py "$PRED_FILE" cloud_assignment/data/validation.jsonl --min-validity 95 --out results/ci_score_report.json

  # ----------------------------------------------------------------------------
  # Stage 4: Secret Scanning (Gitleaks)
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: [model-evaluation]
    if: always() && !cancelled()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITLEAKS_VERSION="8.24.0"
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          ASSET_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"
          if ! curl -fL --retry 3 -H "User-Agent: GitHub-Actions" "$ASSET_URL" -o gitleaks.tar.gz || ! tar -tzf gitleaks.tar.gz >/dev/null 2>&1; then
            echo "Direct download failed or archive invalid; using GitHub CLI..."
            rm -f gitleaks.tar.gz
            gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks --pattern "$ASSET" --output gitleaks.tar.gz
            tar -tzf gitleaks.tar.gz >/dev/null
          fi

          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version

      - name: Run Gitleaks Secret Scanner
        run: |
          gitleaks git --verbose --redact
